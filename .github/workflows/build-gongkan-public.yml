name: 构建共看公开版 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 解包公开应用源代码
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q gongkan-public-source.zip -d build-src

      - name: 构建 Release APK
        working-directory: build-src
        run: gradle :app:assembleRelease

      - name: 恢复正式签名钥匙
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gongkan-release-key.jks"

      - name: 签名正式 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          UNSIGNED=$(find build-src/app/build/outputs/apk/release -type f -name '*-unsigned.apk' | head -1)
          test -n "$APKSIGNER"
          test -n "$UNSIGNED"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/gongkan-release-key.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out build-src/app/build/outputs/apk/release/gongkan-v2.1.apk \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs build-src/app/build/outputs/apk/release/gongkan-v2.1.apk

      - name: 上传正式 APK
        uses: actions/upload-artifact@v4
        with:
          name: gongkan-v2.1-release
          path: build-src/app/build/outputs/apk/release/gongkan-v2.1.apk

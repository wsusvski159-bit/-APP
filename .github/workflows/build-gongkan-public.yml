name: Build 共看公开版 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack public app source
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q gongkan-public-source.zip -d build-src

      - name: Build public APK
        working-directory: build-src
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gongkan-public-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
